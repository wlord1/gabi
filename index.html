<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Table Practice</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --danger: #ef4444;
            --bg: #f8fafc;
            --text: #0f172a;
            --card-bg: #ffffff;
            --gray: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        h1 { margin-top: 0; color: var(--primary); }

        /* Menu Styles */
        .settings-row {
            display: flex;
            gap: 20px;
            margin: 1.5rem 0;
            text-align: left;
        }

        .settings-group {
            flex: 1;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
        }

        .settings-group label.title {
            display: block;
            font-weight: bold;
            margin-bottom: 0.8rem;
            color: #334155;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .checkbox-btn input { display: none; }
        .checkbox-btn span {
            display: block; padding: 10px;
            border: 2px solid var(--gray); border-radius: 8px;
            text-align: center; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; transition: all 0.2s; background: white;
        }
        .checkbox-btn input:checked + span {
            background-color: var(--primary); border-color: var(--primary); color: white;
        }

        .radio-option {
            display: block; margin-bottom: 8px; font-size: 1.1rem; cursor: pointer;
        }
        .radio-option input { margin-right: 8px; transform: scale(1.2); }

        .controls { display: flex; gap: 20px; margin-bottom: 1.5rem; text-align: left; }
        .control-item { flex: 1; }
        .control-item label { font-weight: bold; display: block; margin-bottom: 5px; }
        
        input[type="number"] {
            width: 100%; padding: 10px; font-size: 1.1rem;
            border: 2px solid var(--gray); border-radius: 8px; outline: none;
        }
        input[type="number"]:focus { border-color: var(--primary); }

        button {
            width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold;
            color: white; background-color: var(--primary); border: none;
            border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button.alt-btn { background-color: var(--secondary); }
        button.alt-btn:hover { background-color: var(--secondary-hover); }
        button.cancel-btn { background-color: var(--danger); margin-top: 2rem; width: auto; padding: 10px 20px; }
        button.flag-btn { background-color: var(--warning); margin-top: 1rem; width: auto; padding: 10px 20px; }
        button.flag-btn:hover { background-color: var(--warning-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Practice Area Styles */
        #practice-area, #complete-area { display: none; }
        .progress { font-size: 1.1rem; color: #64748b; font-weight: bold; margin-bottom: 1rem; }
        
        .equation-display {
            font-size: 4.5rem; font-weight: bold; margin: 2rem 0;
            min-height: 120px; display: flex; justify-content: center; align-items: center; gap: 15px;
        }

        /* Missing Variable / Answer styles */
        .answer-passive {
            color: var(--secondary); opacity: 0; transition: opacity 0.2s;
        }
        .answer-passive.visible { opacity: 1; }
        .missing-box {
            color: var(--gray); border-bottom: 4px solid var(--gray); padding: 0 10px;
        }

        /* Typed Input styles */
        input.answer-input {
            width: 100px; height: 90px; font-size: 4rem; font-weight: bold;
            text-align: center; color: var(--primary); background: transparent;
            border: 4px solid var(--primary); border-radius: 12px; outline: none;
        }
        input.answer-input:focus { border-color: var(--primary-hover); box-shadow: 0 0 10px rgba(37, 99, 235, 0.3); }
        input.answer-input.error {
            border-color: var(--danger); color: var(--danger); animation: shake 0.4s;
        }
        input.answer-input.success { border-color: var(--secondary); color: var(--secondary); }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div class="container" id="menu-area">
        <h1>Times Table Practice</h1>
        
        <div class="settings-group" style="background: transparent; padding: 0;">
            <label class="title">Select Tables (2-9):</label>
            <div class="number-grid">
                <label class="checkbox-btn"><input type="checkbox" value="2" class="table-cb"><span>2</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="3" class="table-cb"><span>3</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="4" class="table-cb"><span>4</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="5" class="table-cb"><span>5</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="6" class="table-cb"><span>6</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="7" class="table-cb"><span>7</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="8" class="table-cb"><span>8</span></label>
                <label class="checkbox-btn"><input type="checkbox" value="9" class="table-cb"><span>9</span></label>
            </div>
        </div>

        <div class="settings-row">
            <div class="settings-group">
                <label class="title">Order:</label>
                <label class="radio-option"><input type="radio" name="order" value="random" checked> Random</label>
                <label class="radio-option"><input type="radio" name="order" value="inorder"> In-Order</label>
            </div>
            
            <div class="settings-group">
                <label class="title">Interaction Mode:</label>
                <label class="radio-option"><input type="radio" name="interaction" value="typed" onchange="toggleDuration()" checked> Type the Answer</label>
                <label class="radio-option"><input type="radio" name="interaction" value="passive" onchange="toggleDuration()"> Watch & Wait</label>
            </div>
        </div>

        <div class="settings-row">
            <div class="settings-group" style="flex: 100%;">
                <label class="radio-option" style="font-weight: bold; margin: 0;">
                    <input type="checkbox" id="missing-var"> Enable Missing Variables (e.g. 6 &times; ? = 42)
                </label>
            </div>
        </div>

        <div class="controls">
            <div class="control-item" id="duration-container" style="opacity: 0.5; pointer-events: none;">
                <label for="duration">Wait Duration (Seconds):</label>
                <input type="number" id="duration" min="1" max="10" value="4">
            </div>
            <div class="control-item">
                <label for="cycles">Number of Cycles:</label>
                <input type="number" id="cycles" min="1" value="1">
            </div>
        </div>

        <button onclick="startPractice(false)">Start Selected Tables</button>
        <button class="alt-btn" onclick="startPractice(true)">Start "Minimum 36" Mode</button>
    </div>

    <!-- PRACTICE AREA -->
    <div class="container" id="practice-area">
        <div class="progress" id="progress-text">Cycle 1/1 | Problem 1/8</div>
        
        <div class="equation-display" id="equation-display">
            <!-- Dynamically injected based on settings -->
        </div>

        <div>
            <button class="flag-btn" id="flag-btn" onclick="flagCurrentProblem()">Flag for Review</button>
        </div>
        <button class="cancel-btn" onclick="returnToMenu()">Stop & Return</button>
    </div>

    <!-- COMPLETE AREA -->
    <div class="container" id="complete-area">
        <h1>Practice Complete!</h1>
        <p style="font-size: 1.2rem; margin-bottom: 2rem; color: #64748b;">Great job! You mastered the set.</p>
        <button onclick="returnToMenu()">Return to Menu</button>
    </div>

    <script>
        let practiceList = [];
        let reviewQueue = [];
        let currentIndex = 0;
        let timerId = null;
        let timerId2 = null;
        let totalCycles = 1;
        let currentCycle = 1;
        let setSize = 0;
        let durationMs = 4000;
        let currentExpectedAnswer = 0;
        let isReviewPhase = false;

        // Settings variables
        let isRandom = true;
        let isTyped = true;
        let useMissingVar = false;

        function toggleDuration() {
            const isPassive = document.querySelector('input[name="interaction"]:checked').value === 'passive';
            const durationDiv = document.getElementById('duration-container');
            if (isPassive) {
                durationDiv.style.opacity = '1';
                durationDiv.style.pointerEvents = 'auto';
            } else {
                durationDiv.style.opacity = '0.5';
                durationDiv.style.pointerEvents = 'none';
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startPractice(isMinimumMode) {
            let baseSet = [];
            reviewQueue = [];
            isReviewPhase = false;

            // Get user settings
            isRandom = document.querySelector('input[name="order"]:checked').value === 'random';
            isTyped = document.querySelector('input[name="interaction"]:checked').value === 'typed';
            useMissingVar = document.getElementById('missing-var').checked;
            
            totalCycles = parseInt(document.getElementById('cycles').value) || 1;
            let seconds = parseInt(document.getElementById('duration').value) || 4;
            if (seconds < 1) seconds = 1;
            if (seconds > 10) seconds = 10;
            if (totalCycles < 1) totalCycles = 1;
            durationMs = seconds * 1000;

            if (isMinimumMode) {
                for (let i = 2; i <= 9; i++) {
                    for (let j = i; j <= 9; j++) {
                        // Keep order consistent initially if "In-Order", randomize visual swap if "Random"
                        if (isRandom && Math.random() > 0.5 && i !== j) {
                            baseSet.push({ a: j, b: i, ans: i * j });
                        } else {
                            baseSet.push({ a: i, b: j, ans: i * j });
                        }
                    }
                }
            } else {
                const checkboxes = document.querySelectorAll('.table-cb:checked');
                const selectedTables = Array.from(checkboxes).map(cb => parseInt(cb.value));

                if (selectedTables.length === 0) {
                    alert("Please select at least one number from the grid.");
                    return;
                }

                selectedTables.forEach(t => {
                    for (let i = 2; i <= 9; i++) {
                        baseSet.push({ a: t, b: i, ans: t * i });
                    }
                });
            }

            setSize = baseSet.length;
            practiceList = [];

            for (let c = 0; c < totalCycles; c++) {
                let cycleSet = [...baseSet];
                if (isRandom) shuffleArray(cycleSet);
                practiceList = practiceList.concat(cycleSet);
            }

            currentIndex = 0;
            document.getElementById('menu-area').style.display = 'none';
            document.getElementById('complete-area').style.display = 'none';
            document.getElementById('practice-area').style.display = 'block';
            
            runNextQuestion();
        }

        function runNextQuestion() {
            clearTimeout(timerId);
            clearTimeout(timerId2);

            // Reset Flag Button
            const flagBtn = document.getElementById('flag-btn');
            flagBtn.disabled = false;
            flagBtn.innerText = "Flag for Review";

            // Check if we reached the end of the current list
            if (currentIndex >= practiceList.length) {
                if (reviewQueue.length > 0) {
                    // Enter review phase
                    practiceList = [...reviewQueue];
                    reviewQueue = [];
                    currentIndex = 0;
                    isReviewPhase = true;
                    setSize = practiceList.length;
                    if (isRandom) shuffleArray(practiceList);
                } else {
                    finishPractice();
                    return;
                }
            }

            const currentProblem = practiceList[currentIndex];
            currentProblem.flagged = false; // Reset flag state

            if (isReviewPhase) {
                document.getElementById('progress-text').innerText = `Review Pile | Problem ${currentIndex + 1}/${setSize}`;
            } else {
                currentCycle = Math.floor(currentIndex / setSize) + 1;
                let problemInCycle = (currentIndex % setSize) + 1;
                document.getElementById('progress-text').innerText = `Cycle ${currentCycle}/${totalCycles} | Problem ${problemInCycle}/${setSize}`;
            }

            // Determine display format (Missing Var logic)
            // 0 = Standard (Find Ans), 1 = Missing A, 2 = Missing B
            let problemFormat = 0;
            if (useMissingVar) {
                problemFormat = Math.floor(Math.random() * 3);
            }

            const display = document.getElementById('equation-display');
            let html = "";

            if (isTyped) {
                // Typed Input Mode
                let inputHtml = `<input type="number" class="answer-input" id="user-input" autocomplete="off">`;
                
                if (problemFormat === 1) {
                    html = `${inputHtml} &times; ${currentProblem.b} = ${currentProblem.ans}`;
                    currentExpectedAnswer = currentProblem.a;
                } else if (problemFormat === 2) {
                    html = `${currentProblem.a} &times; ${inputHtml} = ${currentProblem.ans}`;
                    currentExpectedAnswer = currentProblem.b;
                } else {
                    html = `${currentProblem.a} &times; ${currentProblem.b} = ${inputHtml}`;
                    currentExpectedAnswer = currentProblem.ans;
                }
                
                display.innerHTML = html;
                const inputEl = document.getElementById('user-input');
                inputEl.focus();
                
                // Add event listener for Enter key
                inputEl.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        checkTypedAnswer();
                    }
                });

            } else {
                // Passive Mode (Watch & Wait)
                if (problemFormat === 1) {
                    html = `<span class="answer-passive" id="ans-text">${currentProblem.a}</span> <span class="missing-box" id="q-box">?</span> &times; ${currentProblem.b} = ${currentProblem.ans}`;
                } else if (problemFormat === 2) {
                    html = `${currentProblem.a} &times; <span class="answer-passive" id="ans-text">${currentProblem.b}</span> <span class="missing-box" id="q-box">?</span> = ${currentProblem.ans}`;
                } else {
                    html = `${currentProblem.a} &times; ${currentProblem.b} = <span class="answer-passive" id="ans-text">${currentProblem.ans}</span>`;
                }
                
                display.innerHTML = html;
                
                timerId = setTimeout(() => {
                    document.getElementById('ans-text').classList.add('visible');
                    const qBox = document.getElementById('q-box');
                    if(qBox) qBox.style.display = 'none'; // Hide the '?' if it was missing var
                    
                    timerId2 = setTimeout(() => {
                        currentIndex++;
                        runNextQuestion();
                    }, 2000); // Give 2 seconds to view the answer
                }, durationMs);
            }
        }

        function checkTypedAnswer() {
            const inputEl = document.getElementById('user-input');
            const userVal = parseInt(inputEl.value);

            if (userVal === currentExpectedAnswer) {
                inputEl.classList.remove('error');
                inputEl.classList.add('success');
                inputEl.disabled = true; // prevent double hitting enter
                
                setTimeout(() => {
                    currentIndex++;
                    runNextQuestion();
                }, 400); // Quick transition when correct
            } else {
                inputEl.classList.add('error');
                // Auto-flag on wrong answer (optional, but helpful for typed mode)
                flagCurrentProblem();
                
                setTimeout(() => {
                    inputEl.classList.remove('error');
                    inputEl.value = '';
                    inputEl.focus();
                }, 500);
            }
        }

        function flagCurrentProblem() {
            const currentProblem = practiceList[currentIndex];
            if (!currentProblem.flagged) {
                currentProblem.flagged = true;
                reviewQueue.push({...currentProblem}); // Clone it into review queue
                
                const flagBtn = document.getElementById('flag-btn');
                flagBtn.innerText = "Flagged!";
                flagBtn.disabled = true;
            }
        }

        function finishPractice() {
            clearTimeout(timerId);
            clearTimeout(timerId2);
            document.getElementById('practice-area').style.display = 'none';
            document.getElementById('complete-area').style.display = 'block';
        }

        function returnToMenu() {
            clearTimeout(timerId);
            clearTimeout(timerId2);
            document.getElementById('practice-area').style.display = 'none';
            document.getElementById('complete-area').style.display = 'none';
            document.getElementById('menu-area').style.display = 'block';
        }

        // Initialize display logic on load
        toggleDuration();
    </script>
</body>
</html>
